<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="description"
      content="Doc Studio — a document workbench for Markdown, HTML, JSON, XML, XFA/XDP and cURL requests, with PDF export and a built-in API runner." />

    <!-- iOS "Add to Home Screen" hints. Safari does not read the PWA
         manifest for icon / status-bar / app-title, so these mirror
         the manifest values as classic meta tags. `black-translucent`
         lets the app draw under the status bar which pairs with the
         viewport-fit=cover above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doc Studio" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Legacy Microsoft tile (Edge on Windows treats this as the
         start-menu tile when installed). -->
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icons/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>Doc Studio</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
