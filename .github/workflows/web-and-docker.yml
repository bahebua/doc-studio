# Doc Studio — CI: web build + Docker image push.
#
# Runs on every push / PR to `main`. On push to `main` it also builds and
# publishes a multi-arch Docker image to GitHub Container Registry (GHCR).
# The static PWA bundle (`dist/`) is uploaded as a workflow artifact so
# you can grab it from the Actions tab and drop it on any web host.
#
# No secrets required beyond the auto-provisioned GITHUB_TOKEN.

name: web-and-docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed to attach single-file bundle to GitHub Releases on tag push
  packages: write

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (PWA + PNG icons via prebuild)
        run: npm run build

      - name: Read package version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-studio-web-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  single-file:
    name: Build standalone single-file HTML
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build single-file bundle (dist-single/index.html)
        run: npm run build:single

      - name: Rename artefact to a shareable filename
        run: |
          mkdir -p out
          cp dist-single/index.html "out/doc-studio-${{ needs.build.outputs.version }}.html"
          # also ship a plain 'doc-studio.html' for latest-download links
          cp dist-single/index.html "out/doc-studio.html"
          ls -lh out/

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-studio-single-file-${{ needs.build.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Attach single-file bundle to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/doc-studio-${{ needs.build.outputs.version }}.html
            out/doc-studio.html
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & push Docker image
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          # Lower-case the owner/name for GHCR compatibility.
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ needs.build.outputs.version }}
            ${{ steps.tags.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
