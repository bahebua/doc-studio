# Doc Studio — CI: iOS unsigned build via Capacitor 6 + Xcode.
#
# Produces an unsigned .app in the Debug configuration for smoke-testing.
# A signed .ipa for TestFlight / App Store requires an Apple Developer
# account and provisioning profile — see the commented section at the
# bottom.

name: ios

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned .app
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Bootstrap iOS project (first run only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: CocoaPods install
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # For signed release IPAs, add secrets IOS_CERTIFICATE_BASE64,
      # IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, then:
      #
      # - name: Import cert & profile
      #   env:
      #     CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      #     CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #     PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     KEYCHAIN=build.keychain
      #     security create-keychain -p "" $KEYCHAIN
      #     security default-keychain -s $KEYCHAIN
      #     security unlock-keychain -p "" $KEYCHAIN
      #     echo "$CERT_B64" | base64 -d > cert.p12
      #     security import cert.p12 -k $KEYCHAIN -P "$CERT_PWD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo "$PROFILE_B64" | base64 -d > \
      #       ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
      # - name: Archive & export IPA
      #   working-directory: ios/App
      #   run: |
      #     xcodebuild -workspace App.xcworkspace -scheme App \
      #       -configuration Release -archivePath build/App.xcarchive archive
      #     xcodebuild -exportArchive -archivePath build/App.xcarchive \
      #       -exportOptionsPlist ExportOptions.plist \
      #       -exportPath build/ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-studio-ios-buildlog
          path: |
            ios/App/build/Logs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
